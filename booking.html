<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>預約 — line-booking</title>
<link rel="stylesheet" href="assets/base.css">
</head>
<body class="lb-body">

<div class="lb-shell">

  <header class="lb-head">
    <h1>預約</h1>
    <p class="lb-sub" id="sub">載入中…</p>
    <p class="lb-notice">首次開啟與切換月份需要幾秒讀取，請耐心等待 🙏</p>
  </header>

  <!-- 皮膚切換條已移除（2026-08-26）：試皮膚改用調色間 skins.html，
       或網址加 ?skin=washi。日後皮膚選擇移到後台。 -->

  <main id="app"></main>

  <section class="lb-mine lb-hide" id="mine">
    <h2>我的預約</h2>
    <ul id="mineList"></ul>
    <p class="lb-notice">如需變更或取消，請直接與本店聯繫。</p>
  </section>

</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<script src="assets/config.js"></script>
<script src="assets/skin-engine.js"></script>

<!-- ── 皮膚 ────────────────────────────────────────────────────
     新增一個皮膚 = 在 skins/ 放一個檔 + 這裡加一行。就這樣。 -->
<script src="skins/classic.js"></script>
<script src="skins/washi.js"></script>
<script src="skins/neon.js"></script>
<script src="skins/ledger.js"></script>

<script src="assets/booking-core.js"></script>

<script>
(function () {
  'use strict';

  var CFG = window.LB_CONFIG;
  var sub = document.getElementById('sub');

  /* 皮膚仍照 DEFAULT_SKIN / ?skin= / localStorage 生效，只是不再給客戶選單 */
  LB.Skins.boot();

  /* ── 元件 ── */
  var app = new LB.Booking(document.getElementById('app'));

  function start(note) {
    sub.textContent = note;
    app.load();
  }

  /* ── 我的預約（唯讀，規格 §8.3）── */
  function loadMine() {
    if (LB.util.isMock()) return;
    LB.util.call('myBookings', {}).then(function (raw) {
      if (!raw || raw.ok === false) return;   // 讀不到就整區不顯示，不打擾預約主流程
      var list = (raw.data && raw.data.bookings) || [];
      var box = document.getElementById('mine');
      var ul = document.getElementById('mineList');
      if (!list.length) { box.classList.add('lb-hide'); return; }
      ul.textContent = '';
      list.forEach(function (b) {
        var li = document.createElement('li');
        li.setAttribute('data-status', b.status);
        li.textContent = b.date + '　' + b.start + ' – ' + b.end + '　' +
                         (b.status === 'confirmed' ? '已確認 ✅' : '待確認 ⏳');
        ul.appendChild(li);
      });
      box.classList.remove('lb-hide');
    }).catch(function () {});
  }
  document.getElementById('app').addEventListener('lb:booked', loadMine);

  if (LB.util.isMock()) {
    start('MOCK 模式 — 未設定 GAS_URL，資料為本機模擬，適合調樣式。');
    return;
  }

  if (typeof liff === 'undefined') {
    start('LIFF SDK 載入失敗，改用唯讀顯示。');
    return;
  }

  /* ── 過期頁面自救 ─────────────────────────────────────────────
   * LINE 內建瀏覽器常把整頁連同過期的 idToken 一起從快取撈回來，
   * 客戶看到的就是「登入已失效」死頁。三道防線：
   *   1. bfcache 撈回（pageshow persisted）→ 直接重新整理，重走 liff.init
   *   2. 每次打後端前檢查 token 快過期 → 自動重新登入
   *   3. 後端回 UNAUTHORIZED → 同樣自動重新登入
   * 重新登入走 redirect，LINE 內免輸入帳密，客戶只會看到閃一下。
   * sessionStorage 記時間戳防無限迴圈。
   */
  window.addEventListener('pageshow', function (e) {
    if (e.persisted) window.location.reload();
  });

  function tokenStale() {
    try {
      var d = liff.getDecodedIDToken();
      return !d || !d.exp || (d.exp * 1000 - Date.now() < 60000);
    } catch (e) { return true; }
  }

  function relogin() {
    try {
      var last = Number(sessionStorage.getItem('lb.relogin') || 0);
      if (Date.now() - last < 120000) return false;   // 2 分鐘內只試一次，防迴圈
      sessionStorage.setItem('lb.relogin', String(Date.now()));
    } catch (e) {}
    sub.textContent = '登入已過期，自動重新登入中…';
    try { liff.logout(); } catch (e) {}
    liff.login({ redirectUri: window.location.href });
    return true;
  }

  LB.checkTokenStale = tokenStale;
  LB.onAuthError = relogin;

  liff.init({ liffId: CFG.LIFF_ID }).then(function () {
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: window.location.href }); return; }
    if (tokenStale() && relogin()) return;   // init 撈回舊 session 的過期 token
    LB.idToken = liff.getIDToken() || null;
    return liff.getProfile().then(function (p) {
      start((p.displayName || '') + ' — 請選擇日期');
      loadMine();
    });
  }).catch(function (e) {
    start('LIFF 初始化失敗（' + (e && e.code ? e.code : '無 code') + '），資料可能無法載入。');
  });
})();
</script>

</body>
</html>
