<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>調色間 — line-booking</title>
<link rel="stylesheet" href="assets/base.css">
<style>
  /* 調色間自己的外殼。刻意也吃 token，這樣改色的效果一眼看得到。 */
  body.lb-body { padding-bottom: 6rem; }
  .lab { max-width: 68rem; margin: 0 auto; display: grid; gap: 1.25rem; }
  @media (min-width: 60rem) {
    .lab { grid-template-columns: 22rem 1fr; align-items: start; }
    .lab__preview { position: sticky; top: 1.1rem; }
  }
  .panel {
    background: var(--sk-surface); border: 1px solid var(--sk-rule);
    border-radius: var(--sk-radius); padding: 1rem;
    display: flex; flex-direction: column; gap: .8rem;
  }
  .panel h2 { margin: 0; font-size: .95rem; font-weight: 600; }
  .panel p.hint { margin: 0; font-size: .78rem; color: var(--sk-ink-muted); }
  .row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
  .row label { font-size: .8rem; color: var(--sk-ink-muted); }
  select, input[type="text"], textarea {
    font: inherit; font-size: .85rem; color: var(--sk-ink);
    background: var(--sk-bg); border: 1px solid var(--sk-rule);
    border-radius: var(--sk-radius-sm); padding: .4rem .55rem;
  }
  input[type="color"] {
    width: 2.1rem; height: 2.1rem; padding: 0; border: 1px solid var(--sk-rule);
    border-radius: var(--sk-radius-sm); background: none; cursor: pointer; flex: none;
  }
  .btn {
    font: inherit; font-size: .84rem; padding: .5rem .85rem; cursor: pointer;
    border: 1px solid var(--sk-accent); border-radius: var(--sk-radius-sm);
    background: var(--sk-accent); color: var(--sk-accent-ink);
  }
  .btn.ghost { background: transparent; color: var(--sk-accent); }
  .btn:active { opacity: .75; }
  .grp { border-top: 1px solid var(--sk-rule); padding-top: .7rem; display: flex; flex-direction: column; gap: .45rem; }
  .grp > h3 {
    margin: 0; font-size: .68rem; letter-spacing: .1em; text-transform: uppercase;
    color: var(--sk-ink-muted); font-weight: 500;
  }
  .tok { display: grid; grid-template-columns: 1fr auto; gap: .4rem; align-items: center; }
  .tok__n { font-size: .78rem; }
  .tok__k { font-size: .64rem; color: var(--sk-ink-muted); font-family: ui-monospace, monospace; }
  .tok__c { display: flex; gap: .3rem; align-items: center; }
  .tok input[type="text"] { width: 9.5rem; font-family: ui-monospace, monospace; font-size: .72rem; }
  textarea { width: 100%; min-height: 15rem; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .72rem; line-height: 1.55; }
  .scroller { max-height: 26rem; overflow-y: auto; padding-right: .3rem; }
  .crumb { font-size: .8rem; color: var(--sk-ink-muted); margin: 0 0 .9rem; }
  .crumb a { color: var(--sk-accent); }
</style>
</head>
<body class="lb-body">

<p class="crumb"><a href="booking.html">← 回預約頁</a> · 調色間（純本機，不會動到線上樣式）</p>

<div class="lab">

  <!-- ── 控制盤 ── -->
  <div class="lab__ctl" style="display:flex;flex-direction:column;gap:1rem">

    <div class="panel">
      <h2>底稿</h2>
      <p class="hint">先挑一個現成皮膚當起點，再往下調。調整只存在這台機器的瀏覽器裡。</p>
      <div class="row">
        <select id="base"></select>
        <button class="btn ghost" id="reset" type="button">還原底稿</button>
      </div>
      <p class="hint" id="blurb"></p>
    </div>

    <div class="panel">
      <h2>色與形</h2>
      <p class="hint">改哪一格，右邊就即時變。留空 = 用底稿的值。</p>
      <div class="scroller" id="tokens"></div>
    </div>

    <div class="panel">
      <h2>匯出</h2>
      <p class="hint">調滿意之後，把下面這段存成 <code>skins/你的名字.js</code>，
        再到 <code>booking.html</code> 加一行 <code>&lt;script&gt;</code> 就完成了。</p>
      <div class="row">
        <label for="newId">id</label>
        <input type="text" id="newId" value="mine" size="10">
        <label for="newName">名稱</label>
        <input type="text" id="newName" value="我的樣式" size="10">
      </div>
      <textarea id="out" readonly spellcheck="false"></textarea>
      <div class="row">
        <button class="btn" id="copy" type="button">複製</button>
        <button class="btn ghost" id="dl" type="button">下載 .js</button>
      </div>
    </div>
  </div>

  <!-- ── 預覽 ── -->
  <div class="lab__preview">
    <div class="panel">
      <h2>預覽</h2>
      <p class="hint">資料是本機模擬的（週二三五六開放），點得動、切得了月份。</p>
      <div id="app"></div>
    </div>
  </div>

</div>

<script src="assets/config.js"></script>
<script>
  /* 調色間永遠走 MOCK，不碰後端 */
  window.LB_CONFIG.GAS_URL = '';
</script>
<script src="assets/skin-engine.js"></script>
<script src="skins/classic.js"></script>
<script src="skins/washi.js"></script>
<script src="skins/neon.js"></script>
<script src="skins/ledger.js"></script>
<script src="assets/booking-core.js"></script>

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var Sk = LB.Skins;

  Sk.boot();
  var app = new LB.Booking($('app'));
  app.load();

  /* ── 底稿選單 ── */
  var base = $('base');
  Sk.list().forEach(function (s) {
    var o = document.createElement('option');
    o.value = s.id; o.textContent = s.name;
    base.appendChild(o);
  });
  base.value = (Sk.current() || {}).id || '';
  showBlurb();

  base.addEventListener('change', function () {
    Sk.clearOverrides();
    Sk.apply(base.value);
    showBlurb();
    fillInputs();
    render();
  });

  $('reset').addEventListener('click', function () {
    Sk.clearOverrides();
    fillInputs();
    render();
  });

  function showBlurb() {
    var s = Sk.get(base.value);
    $('blurb').textContent = s ? s.blurb : '';
  }

  /* ── token 編輯器 ── */
  var host = $('tokens');
  var inputs = {};
  var groups = {};

  Sk.TOKENS.forEach(function (t) {
    if (!groups[t.g]) {
      var g = document.createElement('div');
      g.className = 'grp';
      g.innerHTML = '<h3>' + t.g + '</h3>';
      host.appendChild(g);
      groups[t.g] = g;
    }
    var row = document.createElement('div');
    row.className = 'tok';
    row.innerHTML =
      '<span><span class="tok__n">' + t.n + '</span><br>' +
      '<span class="tok__k">' + t.k + '</span></span>' +
      '<span class="tok__c"></span>';
    var cell = row.querySelector('.tok__c');

    var txt = document.createElement('input');
    txt.type = 'text';
    txt.setAttribute('aria-label', t.n);

    var col = null;
    if (t.t === 'color') {
      col = document.createElement('input');
      col.type = 'color';
      col.setAttribute('aria-label', t.n + ' 色票');
      col.addEventListener('input', function () {
        txt.value = col.value;
        Sk.setOverride(t.k, col.value);
        render();
      });
      cell.appendChild(col);
    }

    txt.addEventListener('input', function () {
      Sk.setOverride(t.k, txt.value.trim());
      if (col && /^#[0-9a-f]{6}$/i.test(txt.value.trim())) col.value = txt.value.trim();
      render();
    });

    cell.appendChild(txt);
    groups[t.g].appendChild(row);
    inputs[t.k] = { txt: txt, col: col, def: t };
  });

  function fillInputs() {
    Object.keys(inputs).forEach(function (k) {
      var v = Sk.effective(k) || '';
      inputs[k].txt.value = v;
      if (inputs[k].col && /^#[0-9a-f]{6}$/i.test(v)) inputs[k].col.value = v;
    });
  }
  fillInputs();

  /* ── 匯出 ── */
  function quote(s) { return "'" + String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'") + "'"; }

  function build() {
    var src = Sk.get(base.value) || { layout: 'grid', scheme: 'auto', fonts: [] };
    var ov = Sk.getOverrides();
    var keys = Object.keys(ov);
    var id = ($('newId').value || 'mine').toLowerCase().replace(/[^a-z0-9_-]/g, '') || 'mine';
    var name = $('newName').value || id;

    var lines = [];
    lines.push('/* 由調色間匯出。底稿：' + (src.name || base.value) + ' */');
    lines.push('LB.Skins.register({');
    lines.push('  id: ' + quote(id) + ',');
    lines.push('  name: ' + quote(name) + ',');
    lines.push('  scheme: ' + quote(src.scheme || 'auto') + ',');
    lines.push('  layout: ' + quote(src.layout || 'grid') + ',');
    if (src.fonts && src.fonts.length) {
      lines.push('  fonts: [' + src.fonts.map(quote).join(', ') + '],');
    }
    if (!keys.length) {
      lines.push('  tokens: {}   /* 還沒動過任何一格 */');
    } else {
      lines.push('  tokens: {');
      keys.forEach(function (k, i) {
        lines.push('    ' + quote(k) + ': ' + quote(ov[k]) + (i < keys.length - 1 ? ',' : ''));
      });
      lines.push('  }');
    }
    lines.push('});');
    if (src.css) {
      lines.push('');
      lines.push('/* 底稿 ' + (src.name || base.value) + ' 另外帶了一段自訂 CSS，');
      lines.push('   調色間不會動它。要一起搬過來的話，複製 skins/' + base.value + '.js');
      lines.push('   裡的 css 欄位貼進上面的 register({ ... }) 即可。 */');
    }
    return lines.join('\n');
  }

  function render() {
    $('out').value = build();
  }
  ['newId', 'newName'].forEach(function (id) {
    $(id).addEventListener('input', render);
  });
  render();

  $('copy').addEventListener('click', function () {
    var ta = $('out');
    var done = function () {
      $('copy').textContent = '已複製 ✓';
      setTimeout(function () { $('copy').textContent = '複製'; }, 1600);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(ta.value).then(done, legacy);
    } else { legacy(); }
    function legacy() {
      ta.removeAttribute('readonly');
      ta.select(); ta.setSelectionRange(0, ta.value.length);
      try { document.execCommand('copy'); done(); } catch (e) {}
      ta.setAttribute('readonly', '');
    }
  });

  $('dl').addEventListener('click', function () {
    var id = ($('newId').value || 'mine').toLowerCase().replace(/[^a-z0-9_-]/g, '') || 'mine';
    var blob = new Blob([$('out').value], { type: 'text/javascript' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = id + '.js';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
  });
})();
</script>

</body>
</html>
