<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>預約管理 — line-booking</title>
<style>
  :root{
    --bg:#f4f5f4; --card:#fff; --ink:#181b1e; --muted:#616c69;
    --rule:#d8ddda; --accent:#1c5c57; --accent-wash:#e2efec;
    --pend:#8a5709; --pend-wash:#f6e9d0;
    --ok:#276b4c; --ok-wash:#dcebe1;
    --err:#96281d; --err-wash:#f7e2de;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#111514;--card:#191e1c;--ink:#e5e9e6;--muted:#96a19c;
          --rule:#2b3230;--accent:#6cc0b4;--accent-wash:#14302c;
          --pend:#e0a44f;--pend-wash:#31240f;
          --ok:#6bc194;--ok-wash:#152c20;
          --err:#e5877b;--err-wash:#301715;}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;
    padding:1rem 1rem 4rem;-webkit-font-smoothing:antialiased}
  .wrap{max-width:34rem;margin:0 auto;display:flex;flex-direction:column;gap:1rem}
  h1{font-size:1.15rem;margin:0}
  #status{font-size:.8rem;color:var(--muted);font-family:ui-monospace,monospace;margin:0}
  .hide{display:none}
  .card{background:var(--card);border:1px solid var(--rule);border-radius:.6rem;padding:1rem}

  .bar{display:flex;align-items:center;gap:.6rem}
  .bar h2{flex:1;text-align:center;font-size:1.02rem;margin:0;
    font-variant-numeric:tabular-nums}
  .bar button{font:inherit;width:2.4rem;height:2.4rem;border-radius:.45rem;cursor:pointer;
    border:1px solid var(--rule);background:var(--card);color:var(--ink)}

  ol.grid{list-style:none;margin: .8rem 0 0;padding:0;display:grid;
    grid-template-columns:repeat(7,1fr);gap:4px}
  ol.grid li{min-height:3.2rem}
  .day{width:100%;height:100%;border:1px solid var(--rule);border-radius:.4rem;
    background:var(--card);color:var(--ink);font:inherit;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;
    padding:.2rem}
  .day[data-state="closed"],.day[data-state="past"],.day[data-state="out_of_range"]{
    color:var(--muted);background:transparent;border-color:transparent;cursor:default}
  .day .n{font-variant-numeric:tabular-nums;font-weight:600}
  .day .b{font-size:.62rem;line-height:1.2;padding:.05em .4em;border-radius:.6em}
  .day .b.pend{background:var(--pend-wash);color:var(--pend)}
  .day .b.conf{background:var(--err-wash);color:var(--err)}
  .day[aria-selected="true"]{outline:2px solid var(--accent);outline-offset:-1px}
  .wk{list-style:none;margin:.8rem 0 0;padding:0;display:grid;
    grid-template-columns:repeat(7,1fr);gap:4px;
    font-size:.7rem;color:var(--muted);text-align:center}

  .slot{border:1px solid var(--rule);border-radius:.5rem;padding: .7rem .8rem;
    display:flex;flex-direction:column;gap:.5rem;margin-top:.6rem}
  .slot[data-state="closed"]{opacity:.55}
  .slot .head{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap}
  .slot .time{font-weight:600;font-variant-numeric:tabular-nums}
  .tag{font-size:.7rem;padding:.1em .5em;border-radius:.6em;white-space:nowrap}
  .tag.open{background:var(--accent-wash);color:var(--accent)}
  .tag.booked{background:var(--pend-wash);color:var(--pend)}
  .tag.closed,.tag.past,.tag.out_of_range{background:transparent;color:var(--muted);
    border:1px solid var(--rule)}
  .tag.conflict{background:var(--err-wash);color:var(--err)}
  .tag.confirmed{background:var(--ok-wash);color:var(--ok)}
  .who{font-size:.92rem;display:flex;flex-direction:column;gap:.15rem}
  .who .note{color:var(--muted);font-size:.84rem;white-space:pre-wrap}
  .acts{display:flex;gap:.6rem;flex-wrap:wrap}
  .acts button{font:inherit;font-size:.9rem;padding:.5rem .9rem;border-radius:.45rem;cursor:pointer}
  .btn-ok{border:1px solid var(--accent);background:var(--accent);color:#fff}
  .btn-no{border:1px solid var(--err);background:transparent;color:var(--err)}
  .acts button:disabled{opacity:.5;cursor:default}
  .btn-sm{border:1px solid var(--rule);background:var(--card);color:var(--muted);
    font-size:.8rem !important;padding:.35rem .7rem !important}
  .dayacts{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.6rem}
  .acts label{display:flex;align-items:center;gap:.3rem;font-size:.82rem;color:var(--muted)}
  .msg{font-size:.85rem;color:var(--muted)}
  .msg[data-tone="error"]{color:var(--err)}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <h1>預約管理</h1>
  <p style="margin:0;font-size:.8rem;color:var(--muted)">載入與操作需要幾秒處理，請耐心等待 🙏</p>
  <p id="status">載入 LIFF SDK…</p>

  <div id="cal" class="card hide">
    <div class="bar">
      <button id="prev" type="button" aria-label="上個月">←</button>
      <h2 id="title"></h2>
      <button id="next" type="button" aria-label="下個月">→</button>
    </div>
    <ol class="wk"><li>一</li><li>二</li><li>三</li><li>四</li><li>五</li><li>六</li><li>日</li></ol>
    <ol class="grid" id="grid"></ol>
    <p class="msg" id="calmsg"></p>
  </div>

  <div id="daycard" class="card hide">
    <h2 id="daytitle" style="margin:0;font-size:1rem"></h2>
    <div class="dayacts acts">
      <button type="button" class="btn-sm" data-dact="open_day">整日開放</button>
      <button type="button" class="btn-sm" data-dact="close_day">整日公休</button>
      <button type="button" class="btn-sm" data-dact="reset">回預設</button>
    </div>
    <div id="slots"></div>
    <p class="msg" id="daymsg"></p>
  </div>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
(function () {
  'use strict';

  var LIFF_ID = '2011187534-7AVcJ9o4';   // admin-dev
  var GAS_URL = 'https://script.google.com/macros/s/AKfycbyxFgaXWd932IzRUb2wqH-r164B3t3K-F0gkxls9DpK7vfZR6_7DM1FeuJjGFTjh3R1Og/exec';

  var idToken = null;
  var cur = new Date(); cur.setDate(1);
  var selected = null;

  var $ = function (id) { return document.getElementById(id); };
  function setStatus(t, tone) {
    $('status').textContent = t || '';
    if (tone) $('status').style.color = 'var(--err)'; else $('status').style.color = '';
  }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }

  /* 過期頁面自救：偵測 + 自動重新登入，理由與 booking 頁相同 */
  function tokenStale() {
    try {
      var d = liff.getDecodedIDToken();
      return !d || !d.exp || (d.exp * 1000 - Date.now() < 60000);
    } catch (e) { return true; }
  }
  function relogin() {
    try {
      var last = Number(sessionStorage.getItem('lba.relogin') || 0);
      if (Date.now() - last < 120000) return false;
      sessionStorage.setItem('lba.relogin', String(Date.now()));
    } catch (e) {}
    setStatus('登入已過期，自動重新登入中…');
    try { liff.logout(); } catch (e) {}
    if (liff.isInClient && liff.isInClient()) {
      /* LIFF 瀏覽器內不可呼叫 liff.login()（會 400）——
         登入是 liff.init() 自動做的，logout 後 reload 即重新取得新 token */
      window.location.reload();
    } else {
      liff.login({ redirectUri: window.location.href });
    }
    return true;
  }
  window.addEventListener('pageshow', function (e) {
    if (e.persisted) window.location.reload();
  });

  /* text/plain 避開 preflight，理由同 booking 頁 */
  function call(action, payload) {
    if (tokenStale() && relogin()) return new Promise(function () {});
    payload = payload || {};
    payload.idToken = idToken;
    return fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: action, payload: payload })
    }).then(function (r) { return r.text(); }).then(function (t) {
      var b; try { b = JSON.parse(t); } catch (e) {
        throw { code: 'BAD_RESPONSE', message: '後端回的不是 JSON（剛 deploy 完稍等重試）' };
      }
      if (!b.ok) {
        var err = b.error || { code: 'UNKNOWN', message: '未知錯誤' };
        if (err.code === 'UNAUTHORIZED' && relogin()) return new Promise(function () {});
        throw err;
      }
      return b.data;
    });
  }

  /* ── 月曆 ── */
  function loadMonth() {
    var y = cur.getFullYear(), m = cur.getMonth() + 1;
    $('title').textContent = y + ' 年 ' + m + ' 月';
    $('calmsg').textContent = '載入中…';
    $('grid').innerHTML = '';

    call('admin.getMonth', { year: y, month: m }).then(function (data) {
      $('calmsg').textContent = '';
      var first = (new Date(y, m - 1, 1).getDay() + 6) % 7;   /* 週一為每週首日 */
      var days = new Date(y, m, 0).getDate();
      var html = '';
      for (var i = 0; i < first; i++) html += '<li></li>';
      for (var d2 = 1; d2 <= days; d2++) {
        var ds = y + '-' + pad(m) + '-' + pad(d2);
        var x = data[ds] || { state: 'closed', pending: 0, conflict: false };
        var badges = '';
        if (x.pending) badges += '<span class="b pend">待' + x.pending + '</span>';
        if (x.conflict) badges += '<span class="b conf">衝突</span>';
        html += '<li><button type="button" class="day" data-date="' + ds + '"' +
                ' data-state="' + esc(x.state) + '"' +
                (selected === ds ? ' aria-selected="true"' : '') + '>' +
                '<span class="n">' + d2 + '</span>' + badges + '</button></li>';
      }
      $('grid').innerHTML = html;
    }).catch(function (e) {
      $('calmsg').textContent = (e.code ? e.code + '：' : '') + (e.message || e);
      $('calmsg').setAttribute('data-tone', 'error');
    });
  }

  /* ── 單日 ── */
  var STATE_TXT = { open: '開放中', booked: '有預約', closed: '未開放',
                    past: '已過期', out_of_range: '超出範圍' };

  function loadDay(ds) {
    selected = ds;
    $('daycard').classList.remove('hide');
    $('daytitle').textContent = ds;
    $('slots').innerHTML = '';
    $('daymsg').textContent = '載入中…';
    Array.prototype.forEach.call(document.querySelectorAll('.day'), function (el) {
      el.setAttribute('aria-selected', el.getAttribute('data-date') === ds ? 'true' : 'false');
    });

    call('admin.getDay', { date: ds }).then(function (data) {
      $('daymsg').textContent = '';
      var html = '';
      data.slots.forEach(function (s) {
        var st = s.booking && s.booking.status === 'confirmed' ? 'confirmed' : s.state;
        html += '<div class="slot" data-state="' + esc(s.state) + '">' +
          '<div class="head"><span class="time">' + esc(s.start) + ' – ' + esc(s.end) + '</span>' +
          '<span class="tag ' + esc(st) + '">' + esc(s.booking ?
              (s.booking.status === 'pending' ? '待確認' : '已確認') : (STATE_TXT[s.state] || s.state)) + '</span>' +
          (s.conflict ? '<span class="tag conflict">⚠ 與日曆行程重疊</span>' : '') +
          '</div>';
        if (s.booking) {
          var b = s.booking;
          html += '<div class="who"><span>' + esc(b.name) +
                  (b.phone ? '　<a href="tel:' + esc(b.phone) + '">' + esc(b.phone) + '</a>' : '') +
                  (b.hasLine ? '' : '　(無 LINE)') + '</span>' +
                  (b.note ? '<span class="note">' + esc(b.note) + '</span>' : '') + '</div>';
          if (b.status === 'pending') {
            html += '<div class="acts" data-bid="' + esc(b.bookingId) + '">' +
              '<button type="button" class="btn-ok" data-act="confirm">確認</button>' +
              '<button type="button" class="btn-no" data-act="reject">婉拒</button>' +
              '<label><input type="checkbox" data-block>同時封鎖</label></div>';
          }
        } else if (s.state === 'open' || s.state === 'closed') {
          /* 沒預約的格：單格開關。past / out_of_range 沒得調 */
          html += '<div class="acts" data-idx="' + s.idx + '">' +
            (s.state === 'closed'
              ? '<button type="button" class="btn-sm" data-sact="open">開放此格</button>'
              : '<button type="button" class="btn-sm" data-sact="close">關閉此格</button>') +
            '<button type="button" class="btn-sm" data-sact="reset">回預設</button></div>';
        }
        html += '</div>';
      });
      $('slots').innerHTML = html;
    }).catch(function (e) {
      $('daymsg').textContent = (e.code ? e.code + '：' : '') + (e.message || e);
      $('daymsg').setAttribute('data-tone', 'error');
    });
  }

  /* ── 確認 / 婉拒 ── */
  function act(box, action) {
    var bid = box.getAttribute('data-bid');
    var payload = { bookingId: bid };
    if (action === 'admin.rejectBooking') {
      var reason = window.prompt('婉拒原因（會推播給客戶，可留空）', '');
      if (reason === null) return;                     // 按取消
      payload.reason = reason;
      var blockEl = box.querySelector('[data-block]');
      payload.block = !!(blockEl && blockEl.checked);
      if (payload.block && !window.confirm('確定同時封鎖這位客戶？此後其預約一律被拒。')) return;
    }
    Array.prototype.forEach.call(box.querySelectorAll('button'), function (b) { b.disabled = true; });
    $('daymsg').textContent = '處理中…';

    call(action, payload).then(function () {
      $('daymsg').textContent = '';
      loadDay(selected);   // 重拉單日與月曆徽章
      loadMonth();
    }).catch(function (e) {
      Array.prototype.forEach.call(box.querySelectorAll('button'), function (b) { b.disabled = false; });
      $('daymsg').textContent = '失敗 — ' + (e.code ? e.code + '：' : '') + (e.message || e);
      $('daymsg').setAttribute('data-tone', 'error');
    });
  }

  /* ── 事件 ── */
  $('prev').addEventListener('click', function () { cur.setMonth(cur.getMonth() - 1); loadMonth(); });
  $('next').addEventListener('click', function () { cur.setMonth(cur.getMonth() + 1); loadMonth(); });
  $('grid').addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('.day') : null;
    if (!el) return;
    var st = el.getAttribute('data-state');
    if (st === 'closed' || st === 'out_of_range') { /* 管理端也看得到公休日的預約狀況 */ }
    loadDay(el.getAttribute('data-date'));
  });
  $('slots').addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('button[data-act]') : null;
    if (btn) {
      var box = btn.closest('.acts');
      act(box, btn.getAttribute('data-act') === 'confirm' ? 'admin.confirmBooking' : 'admin.rejectBooking');
      return;
    }
    var sbtn = e.target.closest ? e.target.closest('button[data-sact]') : null;
    if (!sbtn) return;
    var sbox = sbtn.closest('.acts');
    setCall('admin.setSlot', {
      date: selected,
      slotIdx: Number(sbox.getAttribute('data-idx')),
      action: sbtn.getAttribute('data-sact')
    }, sbox);
  });

  document.querySelector('.dayacts').addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('button[data-dact]') : null;
    if (!btn || !selected) return;
    var action = btn.getAttribute('data-dact');
    if (action === 'close_day' && !window.confirm(selected + ' 整日設為公休？')) return;
    setCall('admin.setDay', { date: selected, action: action }, btn.parentElement);
  });

  function setCall(api, payload, box) {
    Array.prototype.forEach.call(box.querySelectorAll('button'), function (b) { b.disabled = true; });
    $('daymsg').textContent = '處理中…';
    call(api, payload).then(function (data) {
      /* .dayacts 三顆是靜態元素，不像 #slots 會整塊重建，成功後必須自己解鎖 */
      Array.prototype.forEach.call(box.querySelectorAll('button'), function (b) { b.disabled = false; });
      $('daymsg').textContent = '';
      /* 裁決過的行為：close_day 壓不掉單格的 open override，後端會回報殘留 */
      if (data && data.remainingSlotOverrides && data.remainingSlotOverrides.length) {
        window.alert('⚠ 已設整日公休，但以下時段有「單格開放」設定仍然有效：\n' +
          data.remainingSlotOverrides.map(function (i) {
            return ['11:00','13:30','16:00','18:30','21:00'][i];
          }).join('、') + '\n要完全公休請把這些格「回預設」。');
      }
      loadDay(selected);
      loadMonth();
    }).catch(function (e2) {
      Array.prototype.forEach.call(box.querySelectorAll('button'), function (b) { b.disabled = false; });
      $('daymsg').textContent = '失敗 — ' + (e2.code ? e2.code + '：' : '') + (e2.message || e2);
      $('daymsg').setAttribute('data-tone', 'error');
    });
  }

  /* ── 起動 ── */
  if (typeof liff === 'undefined') { setStatus('LIFF SDK 載入失敗', 1); return; }
  liff.init({ liffId: LIFF_ID }).then(function () {
    if (!liff.isLoggedIn()) {
      setStatus('未登入，導向 LINE Login…');
      if (liff.isInClient && liff.isInClient()) { window.location.reload(); }
      else { liff.login({ redirectUri: window.location.href }); }
      return;
    }
    if (tokenStale() && relogin()) return;
    idToken = liff.getIDToken();
    setStatus('');
    $('cal').classList.remove('hide');
    loadMonth();
  }).catch(function (e) {
    setStatus('liff.init 失敗：' + (e && e.message ? e.message : e), 1);
  });
})();
</script>
</body>
</html>
